<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#FE3C72">
    <title>Swiper App</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="app-container">
        <!-- Header -->
        <header class="header">
            <div class="logo">🔥 Swiper</div>
            <div class="header-icons">
                <button class="icon-btn">⚙️</button>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <div class="cards-container" id="cardsContainer">
                <!-- Cards will be dynamically inserted here -->
            </div>

            <!-- No more cards message -->
            <div class="no-cards" id="noCards" style="display: none;">
                <div class="no-cards-icon">😔</div>
                <h2>No more cards</h2>
                <p>Check back later for more!</p>
            </div>
        </main>

        <!-- Action Buttons -->
        <div class="action-buttons">
            <button class="action-btn pass-btn" id="passBtn">
                <span class="btn-icon">✕</span>
            </button>
            <button class="action-btn like-btn" id="likeBtn">
                <span class="btn-icon">♥</span>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
