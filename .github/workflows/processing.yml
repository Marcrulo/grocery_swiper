name: Weekly processing + notifier

on:
  schedule:
    - cron: '0 0 * * 6'
  workflow_dispatch:

jobs:
  run-python:
    runs-on: ubuntu-latest
    
    permissions:
      contents: write
    
    steps:
    - name: Free up disk space
      run: |
        echo "=== Before cleanup ==="
        df -h
        # Remove unnecessary pre-installed software
        sudo rm -rf /usr/share/dotnet
        sudo rm -rf /opt/ghc
        sudo rm -rf /usr/local/share/boost
        sudo rm -rf "$AGENT_TOOLSDIRECTORY"
        echo "=== After cleanup ==="
        df -h
    
    - name: Checkout repository
      uses: actions/checkout@v3
      with:
        token: ${{ secrets.GITHUB_TOKEN }}
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.12.11'
    
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip --no-cache-dir
        pip install -r requirements_processing.txt --no-cache-dir
    
    - name: Download database backup
      env:
        APP_URL: ${{ secrets.APP_URL }}
      run: |
        if [ -n "$APP_URL" ]; then
          echo "Downloading database from ${APP_URL}/api/db/download"
          mkdir -p data/sql
          curl -f -o data/sql/swipes.db "${APP_URL}/api/db/download" || echo "Failed to download database, continuing without backup"
        else
          echo "APP_URL not set, skipping database download"
        fi
    
    - name: Run Python scripts
      env:
        CLOUDINARY_KEY: ${{ secrets.CLOUDINARY_KEY }}
        EMAIL_ADDRESS: ${{ secrets.EMAIL_ADDRESS }}
        EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
        HF_HOME: /tmp/huggingface  # Use temp directory
        TRANSFORMERS_CACHE: /tmp/huggingface
      run: |
        cd scripts
        python processing.py
        python recommender.py
    
    - name: Clean up immediately after processing
      if: always()
      run: |
        rm -rf /tmp/huggingface
        rm -rf ~/.cache
        df -h
    
    - name: Push output file to branch
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add data/csv/processed/
        git commit -m "Process data $(date +'%Y-%m-%d')" || echo "No changes to commit"
        git add data/csv/mail_groceries.csv
        git commit -m "Latest recommended groceries" || echo "No grocery changes to commit"
        git add data/sql/swipes.db
        git commit -m "Backup database $(date +'%Y-%m-%d')" || echo "No database changes to commit"
        git push -u origin master --force || echo "Nothing to push"